# Pipeline do Nekkora Commercial (COM-RELEASE-003-B §5.4):
#   reproduzir a nekkora-lib → validar integridade → npm ci → typecheck → testes automatizados → build de produção
#   → política de cabeçalhos do CloudFront conferida → artefato versionado → homologação em navegadores reais
#   (Chromium, Firefox, WebKit) servida com a MESMA configuração do CloudFront (servidor local) → preview.
# Nenhum job daqui tem credencial da AWS. O deploy de produção é o workflow "Deploy de produção", que chama este
# pipeline para o commit escolhido e só então pede a aprovação humana do environment "production".
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit a validar (chamado pelo deploy de produção)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lib:
    name: Build nekkora-lib (tarball reproduzível)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Tarball, lockfile e reconstrução a partir do commit registrado
        run: node scripts/verificar-lib.mjs --reconstruir

  commercial:
    name: Validação e build do Commercial
    needs: lib
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: commit
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Testes automatizados (preços, portão, publicação, rollback, auditoria, CloudFront)
        run: npm test
      - name: Build de produção
        run: npm run build
      - name: Política de cabeçalhos do CloudFront corresponde ao build (CSP dos scripts inline)
        run: npm run aws:config:verificar
      - name: Portão de publicação (informativo no CI; bloqueante no deploy)
        run: |
          {
            echo '## Portão de publicação'
            echo '```'
            node scripts/verificar-publicacao.mjs --dist dist || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: commercial-dist-${{ steps.commit.outputs.commit }}
          path: dist/
          include-hidden-files: true
          retention-days: 90

  integracao:
    name: Testes de integração (navegador real)
    needs: commercial
    runs-on: ubuntu-24.04
    # Imagem oficial do Playwright na MESMA versão do lockfile (1.63.0): navegadores e dependências do sistema já
    # instalados. Instalar com --with-deps dependia do espelho apt do runner, que chegou a estourar 30 min.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      # Firefox recusa rodar como root com HOME de outro usuário (orientação do Playwright para a imagem)
      HOME: /root
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: commercial-dist-${{ needs.commercial.outputs.commit }}
          path: dist
      - name: Builds de homologação (dados sintéticos — WhatsApp e só e-mail)
        run: |
          NEKKORA_PUBLICACAO=scripts/fixtures/publicacao-homologacao.json npx vite build --outDir dist-homologacao --logLevel warn
          NEKKORA_PUBLICACAO=scripts/fixtures/publicacao-homologacao-email.json npx vite build --outDir dist-homologacao-email --logLevel warn
      - name: CloudFront local (política de cabeçalhos, função, erros e cache versionados)
        run: |
          node scripts/servidor-cloudfront-local.mjs --dist dist --porta 4173 &
          node scripts/servidor-cloudfront-local.mjs --dist dist-homologacao --porta 4175 &
          node scripts/servidor-cloudfront-local.mjs --dist dist-homologacao-email --porta 4176 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:4173/ && curl -sf -o /dev/null http://127.0.0.1:4175/ && curl -sf -o /dev/null http://127.0.0.1:4176/ && exit 0; sleep 1; done; exit 1
      - name: Artefato servido como no CloudFront (integridade, cabeçalhos, 404, prefixo interno)
        run: node scripts/aws/verificar-site.mjs --base http://127.0.0.1:4173/ --dist dist --bucket-url http://127.0.0.1:4173/__s3/
      - name: Homologação da página (Chromium, Firefox, WebKit)
        run: |
          for b in chromium firefox webkit; do
            NEKKORA_NAVEGADOR=$b node scripts/homologacao.mjs http://127.0.0.1:4173/ evidencias/pagina-$b
          done
      - name: Jornada de conversão — e-mail, canal da publicação (Chromium, Firefox, WebKit)
        run: NEKKORA_CANAL=email node scripts/homologacao-canais.mjs http://127.0.0.1:4176/ evidencias/conversao-email chromium,firefox,webkit
      - name: Jornada de conversão — WhatsApp, quando houver número (Chromium, Firefox, WebKit)
        run: node scripts/homologacao-canais.mjs http://127.0.0.1:4175/ evidencias/conversao-whatsapp chromium,firefox,webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-${{ needs.commercial.outputs.commit }}
          path: evidencias/
          retention-days: 30

  preview:
    # Ambiente "preview": homologação sem publicação — sem nenhuma credencial (nenhuma role da AWS confia neste
    # environment). Resume no PR o que a produção receberia: commit, hash do artefato e o resultado do portão.
    name: Preview (homologação, sem publicação)
    needs: [commercial, integracao]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          name: commercial-dist-${{ needs.commercial.outputs.commit }}
          path: dist
      - name: Resumo da release candidata
        run: |
          node --input-type=module -e '
            const { planFromDist, buildManifest } = await import("./scripts/aws/plano.mjs");
            const plan = planFromDist("dist");
            const m = buildManifest(plan, { publishedAt: null });
            console.log(["## Release candidata", "", `- Commit: \`${m.commit}\``, `- Aplicação: ${m.aplicacao}`, `- nekkora-lib: ${m.nekkoraLib.versao} (${m.nekkoraLib.integridade})`, `- Hash do artefato: \`${m.hashDoArtefato}\``, `- Arquivos: ${m.arquivos.length}`, "- Homologação em navegadores: job \"Testes de integração\" deste run", ""].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
