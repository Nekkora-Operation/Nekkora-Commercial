<!doctype html>
<html lang="pt-BR" data-nk-theme="sage-light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Nekkora — Automação sob medida, da necessidade à execução</title>
    <meta
      name="description"
      content="Nekkora Delivery: automações desenvolvidas por demanda, com escopo, preço e aceite definidos em proposta. Nekkora Hosting: infraestrutura para executá-las, sujeita a avaliação."
    />
    <meta name="theme-color" content="#f4f6f1" />
    <script>
      // Aplica o tema salvo antes da primeira pintura (evita piscar Sage Light antes do Sakura Dark).
      try {
        var t = localStorage.getItem('nekkora-commercial-tema');
        if (t === 'sakura-dark' || t === 'sage-light') document.documentElement.setAttribute('data-nk-theme', t);
      } catch (e) {}
    </script>
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  </head>
  <body class="nk-root">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
